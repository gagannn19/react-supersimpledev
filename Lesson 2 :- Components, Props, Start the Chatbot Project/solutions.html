<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solutions</title>
</head>
<body>

  <div class="js-container"></div>
  
  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">

    function LoginForm() {
      return(
        <>    
          <div>
            <input 
              type="text" 
              placeholder="Email" 
            />
          </div>
          <div>
            <input 
              type="password" 
              placeholder="Password" 
            />
          </div>
          <button>
            Login
          </button>
          <button>
            Sign Up
          </button>
        </>
      )
    }

    function App1 () {
      return(
        <>
          <LoginForm></LoginForm>
          <p>
            Hello, welcome to my website
          </p>
        </>
      );
    };

    function ProductDetails ({ name, discountPrice}) {
      return (
        <>
          {name === "Cotton Socks" && (
            <>
              <p>Name = Cotton Socks</p> 
              
              {discountPrice === "exists" && (
                <>
                  <del><p>Price : $10.90</p></del>
                  <p>Discount Price : $5.45</p>
                </>
              )}
              <p>Price : $10.90</p>
            </>
          )}
          {name === "Tenis Ball" && (
            <>
              <p>Name = Tenis Ball</p> 
              <p>Price : $6.00</p>
            </>
          )}
          {name === "Plain T Shirt" && (
            <>
              <p>Name = Plain T Shirt</p> 
              <p>Price : $7.99</p>
            </>
          )}
          <button>Add to Cart</button>
        </>
      )
    }

    function App2() {
      return (
        <>
          <ProductDetails 
            name = "Cotton Socks"
            discountPrice = "exists"
          />
          <ProductDetails 
            name = "Tenis Ball"
          />
          <ProductDetails
            name = "Plain T Shirt"
          />
        </>
      )
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App2 />);

  </script>

</body>
</html>
