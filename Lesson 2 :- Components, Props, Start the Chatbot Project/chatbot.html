<!-- 
components are a piece of a website.
components are usually designed to be reusable

when building a websites :
- it's better to split up the websites into pieces.
- so we can work on a small piece of a website at a time.

MAIN IDEA OF REACT :-
we can create our own html element.

comments for JSX
{/**/}

Fragment (<></>) = group elements together, without creating an extra <div>


-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
</head>
<body>
  <div class="js-container"></div>
  
  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">
    
    // The component name must start with a capital letter. 
    // Here we are using PascalCase = each word starts with a capital letter 'ChatInput'
    function ChatInput() {
      return (
        <> {/*Fragment*/}
          {/*in html, we don't need to write closing element in input. But JSX is strict. */}
          {/* <input></input> (if there is nothing inside input) = <input /> (shortcut, self closing element) */}
          {/* <input></input> */}
          <input 
            placeholder="Send a message to Chatbot" 
            size="30" 
          />
          <button>Send</button>
        </> 
      )
    }

    function ChatMessage({ message, sender }) { {/* props = properties, props maes our components reusable */}
      // const message = props.message;
      // const sender = props.sender;
      // const {message, sender} = props; {/* This is a shortcut for ... const message = props.message; const sender = props.sender; ... and called destructuring */}

      /*if(sender === 'robot') {
        return (
          <div>
            <img src="robot.png" width="50" />
            {message}
            
          </div>
        );
      }*/

      return (
        <div> {/*In React, we still use div for layout purposes */}
          {sender === 'robot' && (
            <img src="robot.png" width="50" />
          )}
          {message}
          {sender === 'user' && (
            <img src="user.png" width="50 " />
           )}
          {/* <img src="user.png" width="50 " /> */}
        </div>
      );
    };

    function App() {
      return (
        <> {/*Fragment*/}
          {/*{ChatInput()}*/}
          <ChatInput></ChatInput> {/*Component Syntax, Creating our own HTML element called ChatInput*/}
          <ChatMessage 
            message="hello chatbot" 
            sender="user" 
          />
          <ChatMessage 
            message="Hello! How can I help you?" 
            sender="robot"
          />
          <ChatMessage 
            message="can you get me todays date?" 
            sender="user"
          />
          <ChatMessage 
            message="Today is September 27" 
            sender="robot"
          />
        </>
      );
    };

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>
</html>
